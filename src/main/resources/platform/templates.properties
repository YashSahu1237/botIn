# Endings the PLATFORM owns, not any one concern. Neither comes from a decision table.
#
# AGENT_CONNECTING is what every T3 says, whichever concern produced it — a partner has no
# use for our vocabulary, so the reason lives on the ticket and the sentence stays the same.
# AgentHandoffDelegate emits it directly.
#
# INFORM_ALREADY_DONE is the duplicate guard's answer for any action that is not
# AUTO_CREDIT_WALLET (see PerformActionDelegate). It is generic because it has to cover
# actions that do not exist yet — which means the FIRST concern to add an action service
# should ask whether its partners deserve a more specific sentence than this one.

AGENT_CONNECTING   = Aapki baat ek support agent se karayi ja rahi hai. Woh jald hi aapse connect karenge.
INFORM_ALREADY_DONE = Yeh request pehle hi process ho chuki hai.
