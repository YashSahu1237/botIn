# RECHARGE_DEBIT_NO_CREDIT — what the partner reads, keyed by the DMN action code.
#
# The T3 rows (TICKET_PAYU_NO_RESPONSE, TICKET_PAYU_NOT_FOUND, AGENT_UNMATCHED) are absent
# on purpose: every one of them ends at a person, and the partner is told so by
# AGENT_CONNECTING in platform/templates.properties.

INFORM_ALREADY_CREDITED = Yeh recharge aapke wallet mein already credit ho chuka hai.
ASK_RECHARGE_AGAIN      = Aapka recharge fail hua tha. Agar paise cut gaye hain to bank 5-7 din mein wapas kar dega. Aap dobara recharge kar sakte hain.

# MONEY MOVED.
AUTO_CREDIT_WALLET      = Aapka recharge amount wallet mein credit kar diya gaya hai. Balance check kar lijiye.
