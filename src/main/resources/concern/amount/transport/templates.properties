# TRANSPORT_NOT_RECEIVED — what the partner reads, keyed by the DMN action code.
#
# Owned by this concern. Adding a concern no longer means editing a file five other
# concerns also edit, and changing a sentence is no longer a Java change.
#
# Only actions the bot RESOLVES on need a line here. T3 endings all reach the partner as
# AGENT_CONNECTING (platform/templates.properties) and a REROUTE never resolves, so
# TICKET_EXCEEDS_CAP, TICKET_CASHBACK_ANOMALY and AGENT_UNMATCHED are deliberately absent.

INFORM_ALREADY_PAID        = Is booking ka transport amount aapke wallet mein already credit ho chuka hai.
DENY_DID_NOT_TRAVEL        = Record ke hisaab se is booking ke liye aap travel nahi kiye, isliye transport amount applicable nahi hai.
DENY_CASHBACK_COMPENSATES  = Customer ne last minute cancel kiya tha, aur uske liye aapko cashback mil chuka hai. Transport alag se nahi milega.
DENY_WITHIN_HUB            = Yeh job aapke hub ke radius ke andar tha, isliye transport amount applicable nahi hai.

# MONEY MOVED. Deliberately concrete — "credit kar diya gaya hai" and nothing vaguer. A
# partner who has just been paid should be told so in words they can check against their
# balance, not in a sentence that could equally mean "we are looking into it".
AUTO_CREDIT_TRANSPORT      = Transport amount aapke wallet mein credit kar diya gaya hai.
AUTO_CREDIT_DISTANCE       = Aapki travel distance ke hisaab se transport amount wallet mein credit kar diya gaya hai.
