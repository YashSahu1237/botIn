# THE DEMO PROFILE — plan step 96.
#
#     mvn spring-boot:run -Dspring-boot.run.profiles=demo
#
# WHAT IT DOES. Loads demo/fixtures.json so the eight concerns have a world to decide
# about. Without it, and without a UAT read grant, every fact provider returns nulls,
# every table lands on its catch-all, and the demo is eight different ways of saying
# "a person will look at this".
#
# WHAT IT REFUSES TO DO. DemoFixtures FAILS AT STARTUP if a real UAT datasource is
# configured at the same time. Half-real data is worse than either kind: afterwards
# nobody can tell which decisions were evidence and which were invented.
# THE DEMO RUNS ON H2 BY DEFAULT, so it starts with nothing installed.
#
# Requiring a Postgres before anybody can watch the demo is a barrier in front of the one
# artefact meant to be easy to look at. Every value is still overridable, so demoing
# against a real Postgres is a matter of setting BOTIN_DB_URL — the default is a
# convenience, not a decision about where the POC lives.
#
# H2 IS TEST-SCOPED IN pom.xml AND STAYS THAT WAY. `H2 is for tests only, the POC database
# is Postgres` is a deliberate rule and this does not weaken it: the run command adds the
# test classpath explicitly rather than the dependency moving to runtime, so nothing can
# reach H2 by accident.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo -Dspring-boot.run.useTestClasspath=true
#
# PROFILE ORDER MATTERS AND IS NOT ARBITRARY. DemoFixturesTest activates {"demo", "test"}
# in that order, so the test profile is applied LAST and its datasource wins. Both are H2,
# so either way the test is fine — but the order is deliberate rather than lucky.
#
# THE H2 CONSOLE IS ON, AND ONLY HERE.
#
# The demo runs on an IN-MEMORY database. That is the right default — it starts with
# nothing installed — but it also means no SQL client can connect to it: there is no
# port, no file, and it is gone when the JVM stops. So "show me the rows" had no answer,
# on the one artefact whose whole purpose is being looked at.
#
# H2 ships a browser SQL console. Enabling it here gives a reviewer the ticket table, the
# ticket_action ledger and Flowable's ACT_* tables live, during the run, with no client to
# install and nothing to configure.
#
#   http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:botin-demo    user: sa    password: (blank)
#
# IT IS ON THE DEMO PROFILE AND NOWHERE ELSE. An unauthenticated SQL console is exactly
# the kind of thing that must not exist next to real data — and it cannot, because this
# profile refuses to start beside a UAT datasource. Against Postgres, use psql.
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # Loopback only. The default already refuses remote connections; this is explicit
        # so that turning it on later is a decision somebody has to make on purpose.
        web-allow-others: false
  datasource:
    url: ${BOTIN_DB_URL:jdbc:h2:mem:botin-demo;DB_CLOSE_DELAY=-1}
    username: ${BOTIN_DB_USER:sa}
    password: ${BOTIN_DB_PASSWORD:}
    driver-class-name: ${BOTIN_DB_DRIVER:org.h2.Driver}

botin:
  uat:
    # NOT a preference. DemoFixtures will not start if this is true.
    enabled: false

logging:
  level:
    # Every fixture read announces itself at WARN. During a demo, a sceptical reviewer
    # should be able to see which answers came from where — that is exactly the question
    # they ought to be asking.
    in.yesmadam.botin.demo: WARN
    in.yesmadam.botin: INFO
