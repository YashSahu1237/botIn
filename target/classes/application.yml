spring:
  application:
    name: botin

  # ===========================================================================
  # PRIMARY datasource — OURS. Everything BOTIn creates lives here:
  # the 7 tables, and Flowable's ~25 ACT_* tables.
  # NOTHING the POC owns is ever created anywhere else.
  # ===========================================================================
  datasource:
    url: ${BOTIN_DB_URL:jdbc:postgresql://localhost:5432/botin}
    username: ${BOTIN_DB_USER:botin}
    password: ${BOTIN_DB_PASSWORD:botin}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: botin-primary
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns this schema. Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Explicit: migrations run against the PRIMARY datasource and nowhere else.
    # Flyway has no knowledge that a second datasource exists.

# =============================================================================
# SECONDARY datasource — UAT. READ ONLY. Not Spring Boot's `spring.datasource`,
# so nothing auto-configures against it.
#
# What is deliberately NOT attached to it:
#   - no EntityManager, no Hibernate, no JPA repositories
#   - no Flyway
#   - no Flowable
# Fact providers reach it through a JdbcTemplate and nothing else can.
# There is no mechanism here capable of emitting DDL.
#
# Belt and braces: the DB user must be SELECT-only by GRANT, not by convention.
# =============================================================================
botin:
  uat:
    # =========================================================================
    # NO CREDENTIAL IS EVER WRITTEN HERE. These are environment-variable
    # references with NO fallback value, so a missing variable fails at startup
    # rather than silently connecting somewhere unintended.
    #
    # Set them in the shell, or in env/botin-uat.env which .gitignore excludes.
    # env/botin-uat.env.sample shows the shape with no real values in it.
    # =========================================================================
    url: ${UAT_DB_URL}
    username: ${UAT_DB_USER}
    password: ${UAT_DB_PASSWORD}
    # MySQL, not Postgres — the three catalogs live on one MySQL instance and
    # our own schema stays Postgres. Two dialects, two drivers, one service.
    driver-class-name: ${UAT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    pool-size: 5
    # Set false only if a fact provider is deliberately running against fixtures.
    # Tests always run with this false, so no test can need a credential.
    enabled: ${UAT_ENABLED:true}

  # Where a self-serve deflection sends the partner. These belong to the app team:
  # they change without any BOTIn code changing, which is the whole reason they are
  # configuration rather than string literals inside a delegate.
  deeplinks:
    forget-mpin: ${DEEPLINK_FORGET_MPIN:yesmadam://account/security/reset-mpin}

  # Which agent queue a T3 User Task is offered to. One queue for the POC; the
  # candidate group is a process variable rather than a literal in the BPMN, so
  # routing by concern or by language later is configuration, not a process change.
  agent:
    default-queue: ${AGENT_DEFAULT_QUEUE:sp-support}

  # The classifier. UNSET means the deterministic stub is used, and the service says
  # so loudly at startup — that is the current state, and it is deliberate rather than
  # a misconfiguration.
  #
  # NOTE WHAT IS *NOT* HERE: the confidence floor. It lives in the decision tables so a
  # business owner can tune it without a deployment. A copy of 0.7 in this file would be
  # a second source of truth that nobody remembers to change.
  classifier:
    url: ${CLASSIFIER_URL:}
    timeout-ms: ${CLASSIFIER_TIMEOUT_MS:3000}
    # How many times to ask a partner to rephrase before handing to a person. The only
    # mechanism in the design that pushes the agent-connect rate DOWN, so it is a rate
    # control rather than a courtesy — worth tuning against the real response rate.
    clarification-attempts: ${CLARIFICATION_ATTEMPTS:2}

  # Product delivery TAT. BOTH PROD_DELIVERY_DELAY AND VIOL_R9_NO_PRODUCT read these,
  # so changing a number here moves both concerns at once — which is the point.
  #
  # TRANSPORT, CONFIRMED BY THE DECISION MATRIX: "Path 3: distance > radius → Credit
  # (distance - radius) x Rs50". DEFERRED D-B is closed.
  #
  # THIS NUMBER EXISTS TWICE, AND THAT IS A KNOWN COST. The decision table also carries it,
  # as rule 9's `ratePerKmPaise` output. It has to be here as well because the Rs300 cap is
  # a ROW in that table, so the amount must already be computed by the time the table is
  # read — the rate cannot come out of the thing it is an input to.
  #
  # TransportRateConsistencyTest fails if the two ever disagree. Two independent statements
  # forced to agree is the same pattern ProviderContractTest uses; sharing one constant
  # would let them drift together and still look consistent.
  transport:
    rate-per-km-paise: ${TRANSPORT_RATE_PER_KM_PAISE:5000}

  # CONFIRMED BY THE DECISION MATRIX: "Express: same day if before 3PM, next day if after.
  # Standard: ~3 days. Deadline 11 PM."
  #
  # Two earlier readings were wrong and both erred the same way — telling a partner their
  # order was still on time when it was not. Express was treated as a flat one day, and
  # 11 PM was read as an ORDERING cut-off that pushed the clock to the next day rather than
  # as the hour the order becomes late.
  tat:
    standard-days:       ${TAT_STANDARD_DAYS:3}
    # The boundary that decides same-day vs next-day for an Express order.
    express-cutoff-hour: ${TAT_EXPRESS_CUTOFF_HOUR:15}
    # The hour on the due date after which the order is late.
    deadline-hour:       ${TAT_DEADLINE_HOUR:23}

  # THE KILL-SWITCH CONSOLE. One page that can stop — or restart — automatic payments to
  # every partner, so it is never mounted without a way to log in.
  togglz:
    console:
      path: ${TOGGLZ_CONSOLE_PATH:/togglz-console}
      user: ${TOGGLZ_CONSOLE_USER:botin-ops}
      # NO DEFAULT, DELIBERATELY. Unset means the console is NOT REGISTERED at all: the URL
      # 404s and there is nothing to attack. A default password would be worse than none —
      # it looks like security, it is committed to the repository, and it is identical on
      # every machine that ever runs this. Set it in the shell, like every other credential
      # here; env/botin-uat.env is gitignored and is the place for it locally.
      password: ${TOGGLZ_CONSOLE_PASSWORD:}

flowable:
  # Flowable creates its tables in the PRIMARY datasource. It is never given
  # the UAT one — see DataSourceConfig.
  database-schema-update: true
  history-level: audit
  async-executor-activate: true
  process-definition-location-prefix: classpath*:/processes/

togglz:
  enabled: true
  feature-enums: in.yesmadam.botin.safety.BotinFeature

  # WHERE A FLAG'S POSITION IS KEPT: the primary database, via TogglzStateConfig. Not in
  # memory — a switch turned off during an incident must not be turned back on by the next
  # routine deploy. No cache either; see that class for why a kill switch with a TTL is not
  # a kill switch.
  console:
    # OFF HERE ON PURPOSE — the console is registered by TogglzConsoleConfig instead, which
    # mounts it ONLY when a credential exists. A boolean cannot express that condition, and
    # two things registering one servlet on one path is how it works on exactly one machine.
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      classifier:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,togglz

logging:
  level:
    in.yesmadam.botin: INFO
